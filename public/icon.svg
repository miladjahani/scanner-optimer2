<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0e" />
      <stop offset="50%" stop-color="#10141c" />
      <stop offset="100%" stop-color="#03060f" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="8" />

  <!-- Outer Glow Arc -->
  <path d="M120 256 A 136 136 0 0 1 392 256" fill="none" stroke="#00f0ff" stroke-width="6" stroke-dasharray="12 12" opacity="0.6" />
  
  <!-- Cyberpunk Lightning Bolt -->
  <path d="M272 64 L128 272 L240 272 L208 448 L384 224 L272 224 Z" fill="url(#glowGrad)" filter="url(#neonGlow)" />
</svg>
